name: DAVYLAB WeChat Content Package Check

on:
  pull_request:
    paths:
      - "wechat-ops/**"
      - "scripts/validate-wechat-content.mjs"
      - ".github/workflows/wechat-content-check.yml"
  push:
    branches: [main]
    paths:
      - "wechat-ops/**"
      - "scripts/validate-wechat-content.mjs"
      - ".github/workflows/wechat-content-check.yml"

permissions:
  contents: read

jobs:
  validate-content-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test content-type validation
        run: node scripts/validate-wechat-content.mjs --self-test
      - name: Validate repository content packages
        run: node scripts/validate-wechat-content.mjs
