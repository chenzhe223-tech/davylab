name: Visual DNA Motion Adapter Smoke Test

on:
  pull_request:
    paths:
      - "skills/visual-dna-motion/**"
      - "tests/motion-adapter-smoke.mjs"
      - ".github/workflows/motion-adapter-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "skills/visual-dna-motion/**"
      - "tests/motion-adapter-smoke.mjs"
      - ".github/workflows/motion-adapter-smoke.yml"

permissions:
  contents: read

jobs:
  adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exported preset adapter
        run: node tests/motion-adapter-smoke.mjs
